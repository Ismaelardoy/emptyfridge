name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Levantar el stack completo
        run: docker compose up -d --build

      - name: Esperar a la API a través de nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Comprobar que la SPA se sirve
        run: curl -fsS http://localhost:8080/ | grep -q 'id="root"'

      - name: E2E en navegador
        run: pnpm e2e

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

      - name: Limpiar
        if: always()
        run: docker compose down -v
